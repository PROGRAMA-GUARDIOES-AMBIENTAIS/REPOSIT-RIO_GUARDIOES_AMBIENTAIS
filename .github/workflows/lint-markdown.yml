name: lint markdown

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install markdownlint
        run: npm install -g markdownlint-cli

      - name: run lint
        run: markdownlint '**/*.md' --ignore node_modules
